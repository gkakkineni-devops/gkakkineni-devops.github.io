<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{notfound.page.title}}</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="{{base_path}}assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{base_path}}assets/css/site.css?v={{asset_version}}">
  <script src="{{base_path}}assets/js/site.js?v={{asset_version}}" defer></script>
</head>
<body data-page="404" data-root="{{base_path}}" data-github-user="{{github_user}}" data-github-repo="{{github_repo}}">
  <main id="main" class="wrap not-found">
    <p class="mono muted">{{notfound.page.code}}</p>
    <h1>{{notfound.page.headline}}</h1>
    <p class="lede">{{notfound.page.text}}</p>
    <div class="actions">
      <a class="button primary" href="{{base_path}}">{{notfound.page.home}}</a>
      <a class="button" href="{{base_path}}work/">{{notfound.page.work}}</a>
    </div>
  </main>
</body>
</html>
