    <section class="cta" aria-labelledby="cta-title">
      <div class="wrap cta-inner">
        <div>
          <h2 id="cta-title">{{site.cta.title}}</h2>
          <p>{{site.cta.text}}</p>
        </div>
        <div class="cta-actions">
          <a class="button primary" href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to={{site.site.email}}&amp;su={{site.site.email_subject}}" target="_blank" rel="noopener noreferrer">{{site.cta.button}}</a>
          <a class="button" href="{{root}}contact/">{{site.cta.other}}</a>
        </div>
      </div>
    </section>
