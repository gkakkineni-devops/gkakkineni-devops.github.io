  <footer class="footer">
    <div class="wrap footer-inner">
      <div>
        <p class="footer-name">{{site.site.name}}</p>
        <p class="muted">{{site.footer.tagline}}</p>
      </div>
      <nav class="footer-links" aria-label="Footer">
        <a href="{{root}}about/">{{site.nav.about}}</a>
        <a href="{{root}}work/">{{site.nav.work}}</a>
        <a href="{{root}}experience/">{{site.nav.experience}}</a>
        <a href="{{root}}playground/">{{site.nav.playground}}</a>
        <a href="{{root}}contact/">{{site.nav.contact}}</a>
        <a href="{{site.site.linkedin}}" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a href="https://github.com/{{github_user}}" target="_blank" rel="noopener noreferrer">GitHub</a>
      </nav>
      <p class="muted footer-build">{{site.footer.note}} <a class="mono" data-build="short_sha_link" href="https://github.com/{{github_user}}/{{github_repo}}" target="_blank" rel="noopener noreferrer">local</a></p>
    </div>
  </footer>
